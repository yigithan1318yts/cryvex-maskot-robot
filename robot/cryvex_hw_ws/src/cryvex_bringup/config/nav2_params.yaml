# Gercek robot Nav2 parametreleri.
#
# ~/cryvex_ws/src/cryvex_gazebo/config/nav2_params.yaml dosyasindan TURETILDI
# (kopyalanip uyarlandi) - o dosya aylardir Gazebo'da GERCEK KULLANIM
# SENARYOLARIYLA (masalar arasi gezinme, dinamik engelden kacinma, "cok
# yaklasip kilitlenme" gibi GERCEKTEN YASANMIS hatalar) test edilip
# duzeltildi. O yuzden DWB kritik agirliklari / inflation / AMCL gibi SAF
# DAVRANIS parametreleri BURADA DEGISTIRILMEDI - robot gelmeden "kor kor"
# yeniden tahmin etmek, zaten sinanmis degerleri atmak olurdu.
#
# Sim'den farkli olan (gercek donanim oldugu icin ZORUNLU) degisiklikler:
#   - use_sim_time: False        (hepsinde - gercek saat)
#   - robot_base_frame: base_footprint  (base_link degil - bkz. ekf.yaml'daki
#     base_link_frame: base_footprint ve urdf/cryvex_real.urdf.xacro)
#   - amcl.laser_max_range: 12.0 (100.0 degil - YDLIDAR T-mini Plus'in gercek
#     menzili; Unitree L1 3D lidar'in sim'deki degeri degil)
#   - local_costmap.range_layer AKTIF (plugins listesinde) - gercek robotta
#     4x HC-SR04 var, sim'de hic yoktu
#   - pointcloud_to_laserscan YOK (bkz. launch/navigation.launch.py) - YDLIDAR
#     zaten native 2D /scan yayinliyor, sim'deki 3D->2D koprusune gerek yok
#
# Henuz GERCEK OLCUYLE degistirilmesi gereken (sasi kurulunca):
#   - (2026-10-02 YAPILDI) robot_radius 0.30: govde 52 cm capli daire, teker ortalari
#     54 cm aralikli -> tekerler govdeden tasiyor, en dis nokta ~30 cm
#
# 2026-09-17: sim'e keepout_filter (masalarin gercek govde/tabla izdusumu)
# ve speed_filter (kapi/mutfak yavaslama) eklendi ve test edildi (bkz.
# ~/cryvex_ws/src/cryvex_gazebo/config/nav2_params.yaml + navigation.launch.py
# + maps/keepout_mask.*, maps/speed_mask.*). BURAYA BILINCLI OLARAK henuz
# EKLENMEDI - cunku bu iki maske GERCEK kafenin masa/kapi/mutfak
# konumlarina gore cizilir, simdiden uydurma bir maske eklemek yanlis
# guven verir. Gercek harita (Ortami Haritala ile) cikip masa/kapi/mutfak
# konumlari netlesince: sim'deki make_masks.py'nin ayni mantigi (gercek
# koordinatlari veren bir liste + PIL ile PGM/YAML uretme) burada da
# uygulanip global_costmap/local_costmap plugins listesine "keepout_filter"
# ve "speed_filter" eklenecek, navigation.launch.py'ye sim'deki 4 filter-
# server node + lifecycle_manager_costmap_filters birebir kopyalanacak.
amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    # Jazzy: yerlesik BT eklentileri OTOMATIK yuklenir - Humble'daki uzun
    # plugin_lib_names listesi kaldirildi (sadece OZEL eklentiler buraya yazilir).
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    costmap_update_timeout: 0.30
    progress_checker_plugins: ["progress_checker"]   # Jazzy: liste (Humble'da tekil ad)
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # DWB - kafe icin: yavas, yumusak, dinamik engellere karsi guclu kacinma
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.40           # kafe hizi (insanlarin arasinda ~1.4 km/h)
      max_vel_y: 0.0
      max_vel_theta: 1.2
      min_speed_xy: 0.0
      max_speed_xy: 0.40
      min_speed_theta: 0.0
      acc_lim_x: 0.3            # malzeme listesi rev.4 bolum 7 - devrilme riski, sim ile ayni duzeltme
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -0.4        # -2.0 idi, ani frende one yatmayi onlemek icin dusuruldu
      decel_lim_y: 0.0
      decel_lim_theta: -2.5
      vx_samples: 10
      vy_samples: 5
      vtheta_samples: 15
      sim_time: 1.2
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      # Varsayilan kritikler / agirliklar - engelden asiri kacinip kitlenmesin.
      # (Dinamik engel ince ayari gercek robotta yapilacak.)
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # BaseObstacle.scale 0.02 (nav2/TB3 stock degeri) yol/hedef hizalama
      # kritiklerinin (24-32) yaninda neredeyse SIFIR agirlikta kaliyordu -
      # DWB "engelden uzak dur"u pratikte hic onemsemiyordu, bu yuzden
      # haritada olmayan bir engele/masaya cok yaklasip kendini sikistiriyordu
      # ("siyah noktalara cok yanasip kendini esir ediyor", 2026-09-11). 0.3'e
      # cikarildi - hala yol takibinden ONCELIKLI DEGIL (o yuzden eskisi gibi
      # uzaktan durup kilitlenmez) ama artik gercek bir agirligi var.
      BaseObstacle.scale: 0.3
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.30            # 2026-10-02 olculdu: govde 52 cm daire, tekerler 54 cm (en dis ~30 cm) - urdf/cryvex_real.urdf.xacro
                                     # icindeki footprint_radius ile AYNI TUTULMALI. Sasi kurulunca
                                     # ikisini birlikte gercek olcuyle guncelle.
      # denoise_layer tek-piksel LiDAR parazitini siler (hayalet engel / bosuna durma olmaz)
      plugins: ["obstacle_layer", "denoise_layer", "range_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True            # her taramada isin izleyip bosaltir -> engel gecince silinir
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5   # sadece yakin engelleri costmap'e isle (uzaktan kilitlenme yok)
          obstacle_min_range: 0.0
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
        minimal_group_size: 2
        group_connectivity_type: 8
      # 4x HC-SR04 ultrasonik (LiDAR'in gormedigi alcak/cam engeller, ~20 cm
      # yakin dur) - gercek robotta AKTIF (sim'de plugins listesinde YOKTU,
      # cunku Gazebo'da HC-SR04 topic'leri hic yayinlanmiyordu):
      range_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/ultrasonic/fl", "/ultrasonic/fr", "/ultrasonic/rl", "/ultrasonic/rr"]
        input_sensor_type: ALL
        clear_on_max_reading: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.50      # robot yaricapi + ~15 cm (0.45'ten hafif artti). BaseObstacle
                                    # duzeltmesiyle birlikte biraz daha nefes payi icin KUCUK bir
                                    # adim - daha once "cok uzaktan durup kilitleniyor" sikayetine
                                    # yol acan buyuk sicramalari (obstacle_max_range, DWB agirliklari
                                    # vs.) TEKRARLAMIYORUZ, sadece asil kusurlu BaseObstacle.scale'i
                                    # duzeltip burada minimal destek veriyoruz.
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.30
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "denoise_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True            # engel/insan cekilince global plandan da silinir
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
        minimal_group_size: 2
        group_connectivity_type: 8
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.50   # local costmap ile ayni (bkz. yukarida)
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    # yaml_filename BURADA OLMAMALI: launch'in "map" argumani haritayi "/**:"
    # (joker) olarak verir, buradaki "map_server:" (dugum adina ozel) deger ise
    # ondan ONCELIKLIDIR - bos "" yazilirsa harita hic yuklenmez ve AMCL sonsuza
    # dek "Waiting for map" der (Jazzy'de test edildi).

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"   # Jazzy: "::" (Humble'daki "/" artik yuklenmiyor)
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    # Jazzy: yerel+global costmap/footprint ayri verilir, eklenti adlari "::".
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.40, 0.0, 1.2]
    min_velocity: [-0.30, 0.0, -1.2]
    max_accel: [0.3, 0.0, 2.0]
    max_decel: [-0.4, 0.0, -2.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ---- Jazzy'nin navigation_launch.py'sinin EK baslattigi 3 dugum (Humble'da
# yoktu). Ayarlari olmazsa Nav2 hic ayaga kalkmiyor; degerler Jazzy'nin kendi
# nav2_params.yaml'indan, sadece cerceveler bizim URDF'e (base_footprint) gore.

# Rota grafigi sunucusu - KULLANMIYORUZ (masalar arasi serbest Nav2 planlamasi),
# ama grafik dosyasi olmadan acilmiyor: ornek grafik verildi, zararsiz.
route_server:
  ros__parameters:
    use_sim_time: False
    graph_filepath: $(find-pkg-share nav2_route)/graphs/sample_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

# Carpisma izleyici: hiz komutu ile /cmd_vel arasinda son guvenlik katmani
# (malzeme listesi bolum 7 "katmanli durma": LiDAR/Collision Monitor ->
# ultrasonik -> tampon -> acil stop). Robotun izdusumu 1.2 sn icinde LiDAR
# noktasina degecekse yavaslatip durdurur.
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    # Nav2 durduktan sonra /cmd_vel'e "0" basmayi bu kadar surdurur. Kisa:
    # patrol.py'nin manevralari (joystick/kurtulma) /cmd_vel'e dogrudan basar,
    # uzun sure sifir basmak onlarla catisir (varsayilan 2.0).
    stop_pub_timeout: 0.3
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

# Sarj istasyonuna yanasma - robotta istasyon YOK, kullanilmiyor; Jazzy
# baslattigi icin varsayilan tek eklentiyle aciliyor (hicbir dock tanimli degil).
docking_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
